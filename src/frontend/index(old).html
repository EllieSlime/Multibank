<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auth</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 2rem; }
      form, .card { max-width: 420px; padding: 1rem; border: 1px solid #ccc; border-radius: 8px; }
      label { display: block; margin: 0.5rem 0 0.25rem; }
      input { width: 100%; padding: 0.5rem; }
      button { margin-top: 0.75rem; padding: 0.5rem 0.75rem; cursor: pointer; }
      .row { display: flex; gap: 1rem; align-items: center; }
      .muted { opacity: 0.8; font-size: 0.9rem; }
      .error { color: #b00020; white-space: pre-wrap; }
      pre { white-space: pre-wrap; word-break: break-word; }
    </style>
  </head>
  <body>
    <h1>Login</h1>
    <form id="login-form" class="card">
      <label for="identifier">Email or phone</label>
      <input id="identifier" name="identifier" type="text" placeholder="email@example.com or 1234567890" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required />
      <button type="submit">Login</button>
      <div id="login-error" class="error" role="alert"></div>
    </form>

    <h2>Session</h2>
    <div class="card">
      <div class="row">
        <button id="logout-btn">Logout</button>
        <button id="refresh-btn">Refresh access token</button>
      </div>
      <p class="muted">Tokens are stored in localStorage for demo only.</p>
      <h3>Access token</h3>
      <pre id="access-token"></pre>
      <h3>Refresh token</h3>
      <pre id="refresh-token"></pre>
      <div id="action-error" class="error" role="alert"></div>
    </div>

    <script src="/static/login.js" defer></script>
  </body>
  </html>
